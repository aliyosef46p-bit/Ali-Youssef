<!DOCTYPE html>

    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            background: #f3ebe2;
            color: #352017;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
        }

        .page {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .profile-image {
            width: 105px;
            height: 105px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #d8c2b0;
            border: 4px solid #5a3828;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: appear 0.7s ease;
            box-shadow: 0 12px 30px rgba(90, 56, 40, 0.18);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-family: Arial, sans-serif;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #5a3828;
            margin-bottom: 6px;
            animation: appear 0.8s ease;
        }

        h1 {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #42281c;
            animation: appear 0.9s ease;
        }

        .subtitle {
            font-size: 14px;
            color: #866653;
            margin-bottom: 32px;
            animation: appear 1s ease;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;
            min-height: 66px;
            background: #fffaf5;
            border: 1px solid #d7c0ad;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #543425;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(84, 52, 37, 0.09);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
            animation: appear 0.8s ease;
            cursor: pointer;
        }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: #e4d1c0;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 0;
        }

        .link:hover::before {
            transform: translateX(0);
        }

        .link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 32px rgba(84, 52, 37, 0.17);
        }

        .link span {
            position: relative;
            z-index: 1;
        }

        .number {
            position: absolute;
            right: 18px;
            z-index: 2;
            width: 31px;
            height: 31px;
            border-radius: 50%;
            background: #5a3828;
            color: #fffaf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .social-icon {
            position: absolute;
            left: 18px;
            z-index: 2;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 23px;
            height: 23px;
            fill: #5a3828;
        }

        .coffee-icon {
            position: absolute;
            left: 18px;
            z-index: 2;
            font-size: 21px;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #947968;
            animation: appear 1.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 16px;
            }

            .profile-image {
                width: 95px;
                height: 95px;
            }

            .name {
                font-size: 24px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 24px;
            }

            .link {
                min-height: 62px;
                border-radius: 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
